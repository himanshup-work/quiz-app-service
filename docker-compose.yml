#version: "2.31.0"
name: quiz-app-service

services:
  postgres:
    image: postgres:latest
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testing
      POSTGRES_DB: quizappservice
      PGDATA: /var/lib/postgresql/data/pgdata

volumes:
  postgres-data: